
<script>
// v63: 목록 전체를 페이지에 두지 않는다. 품번을 4글자 이상 치고 [검색]을 누르면 서버가 앞부분이 맞는 품번을 최대 3개만 알려준다.
const GAS_URL = "https://script.google.com/macros/s/AKfycbwOrp74H1BYqzJ-8Wv7jv4q5qJ8K0qfA1z6YpHIRz-LsfTCHWrP8SoGe_8QYl51Q_zOew/exec";
const TALK_URL = "https://talk.naver.com/W46FM2";
const BUY_URL = "https://brand.naver.com/bebeknow";   // 아기비데 상품 주소가 정해지면 바꾸기
const MIN = 4;
const STATUS = [
  { cls: "ok", badge: "설치 가능합니다", msg: "" },
  { cls: "chk", badge: "확인이 필요합니다", msg: "세면대 모양이나 두께에 따라 설치가 안 될 수 있습니다. 아래 네이버 톡톡으로 세면대 사진을 보내 주시면 바로 알려드리겠습니다." },
  { cls: "no", badge: "설치가 어렵습니다", msg: "이 세면대에는 설치가 어렵습니다. 다른 세면대에서 쓰실 수 있는지 궁금하시면 아래 네이버 톡톡으로 물어봐 주세요." }
];
const norm = s => String(s).toUpperCase().replace(/[^0-9A-Z가-힣]/g, "");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let brands = [], sentReq = {}, busy = false;

if (TALK_URL) $("talkGuide").href = TALK_URL; else $("talkGuide").hidden = true;
if (BUY_URL) $("prod").href = BUY_URL; else $("prod").hidden = true;
const buyBtn = () => BUY_URL ? `<a class="buy" href="${BUY_URL}" target="_blank" rel="noopener">베베노 아기비데 보러 가기</a>` : "";

function get(params, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 15000);
  const q = Object.keys(params).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
  return fetch(GAS_URL + "?" + q, { signal: ctl.signal, redirect: "follow" }).then(r => r.json()).finally(() => clearTimeout(t));
}
function post(body) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  return fetch(GAS_URL, { method: "POST", body: JSON.stringify(body), signal: ctl.signal, redirect: "follow" }).then(r => r.json()).finally(() => clearTimeout(t));
}
get({ sink: "brands" }).then(j => { if (j && Array.isArray(j.brands)) brands = j.brands; }).catch(() => {});

function card([brandKo, model, st]) {
  const s = STATUS[st] || STATUS[1];
  return `<article class="item ${s.cls}">
    <div class="row"><div><div class="model">${esc(model)}</div><div class="brand">${esc(brandKo)}</div></div><span class="badge">${s.badge}</span></div>
    ${s.msg ? `<p class="msg">${s.msg}</p>` : ""}
    ${st === 0 ? buyBtn() : ""}
  </article>`;
}

/* 등록 안 된 품번: 확인 요청 양식 */
function reqForm(raw) {
  const done = sentReq[norm(raw)];
  if (done) return `<div class="empty"><b>확인 요청이 접수되었습니다.</b>확인되는 대로 목록에 올려 드리겠습니다.${done === 2 ? "<br>남겨 주신 연락처로 결과를 알려드리겠습니다." : ""}<br>더 빨리 알고 싶으시면 아래 네이버 톡톡으로 사진을 보내 주세요.</div>`;
  const opts = [`<option value="">모름</option>`]
    .concat(brands.map(([b, k]) => `<option value="${esc(b)}">${esc(k || b)}</option>`), [`<option value="__self">직접 입력</option>`]).join("");
  return `<div class="empty"><b>등록되지 않은 세면대입니다.</b>품번을 남겨 주시면 확인 후 안내드리겠습니다.
    <form class="req" id="reqForm">
      <label>세면대 품번<input id="rq" maxlength="40" value="${esc(raw)}" required></label>
      <label>브랜드<select id="rb">${opts}</select></label>
      <label id="rbxRow" hidden>브랜드 이름<input id="rbx" maxlength="30" placeholder="예: 로카, 이케아"></label>
      <label>연락처 (선택 · 결과를 문자로 받고 싶으시면)<input id="rp" type="tel" inputmode="tel" maxlength="13" placeholder="010-0000-0000"></label>
      <label class="agree" id="agreeRow" hidden><input type="checkbox" id="ra"> 확인 결과 안내에만 쓰고, 안내 후 지우는 데 동의합니다</label>
      <button type="submit" id="rs">확인 요청 보내기</button>
      <p class="rmsg" id="rmsg"></p>
    </form></div>`;
}
function bindReq() {
  const f = $("reqForm"); if (!f) return;
  $("rp").addEventListener("input", () => { $("agreeRow").hidden = !$("rp").value.trim(); });
  $("rb").addEventListener("change", () => { const self = $("rb").value === "__self"; $("rbxRow").hidden = !self; if (self) $("rbx").focus(); });
  f.addEventListener("submit", e => {
    e.preventDefault();
    const q = $("rq").value.trim(), phone = $("rp").value.replace(/\D/g, "");
    if (norm(q).length < 2) { $("rmsg").textContent = "품번을 2글자 이상 적어 주세요."; return; }
    if (phone && (phone.length < 10 || phone.length > 11)) { $("rmsg").textContent = "연락처를 다시 확인해 주세요."; return; }
    if (phone && !$("ra").checked) { $("rmsg").textContent = "연락처를 남기시려면 동의에 체크해 주세요."; return; }
    $("rs").disabled = true; $("rmsg").textContent = "보내는 중…";
    post({ action: "sinkReq", kind: "request", q, brand: $("rb").value === "__self" ? $("rbx").value.trim() : $("rb").value, phone }).then(r => {
      if (r && r.status === "ok") { sentReq[norm(q)] = phone ? 2 : 1; $("list").innerHTML = reqForm(q); }
      else { $("rs").disabled = false; $("rmsg").textContent = "잠시 후 다시 보내 주세요. 급하시면 아래 톡톡으로 물어봐 주세요."; }
    }).catch(() => { $("rs").disabled = false; $("rmsg").textContent = "연결이 불안정합니다. 잠시 후 다시 보내 주세요."; });
  });
}

function search(raw) {
  raw = raw.trim();
  if (norm(raw).length < MIN) {
    $("meta").textContent = "";
    $("list").innerHTML = `<div class="empty"><b>품번을 ${MIN}글자 이상 입력해 주세요</b>예: CL-831, IL672E, DSL-306</div>`;
    return;
  }
  if (busy) return;
  busy = true; $("go").disabled = true;
  $("meta").textContent = "";
  $("list").innerHTML = `<div class="empty"><b>검색 중입니다.</b></div>`;
  get({ sink: "find", q: raw }).then(j => {
    if (!j || j.status === "busy") { $("list").innerHTML = `<div class="empty"><b>잠시 후 다시 검색해 주세요</b>급하시면 아래 네이버 톡톡으로 물어봐 주세요.</div>`; return; }
    if (j.status === "short") { $("list").innerHTML = `<div class="empty"><b>품번을 ${MIN}글자 이상 입력해 주세요</b></div>`; return; }
    const items = j.items || [];
    if (!items.length) { $("list").innerHTML = reqForm(raw); bindReq(); return; }
    $("meta").textContent = j.more ? "비슷한 품번이 더 있습니다. 품번을 끝까지 입력하면 정확하게 찾을 수 있습니다." : "";
    $("list").innerHTML = items.map(card).join("");
  }).catch(() => {
    $("list").innerHTML = `<div class="empty"><b>연결이 불안정합니다.</b>잠시 후 다시 검색해 주세요.</div>`;
  }).finally(() => { busy = false; $("go").disabled = false; });
}
$("sform").addEventListener("submit", e => { e.preventDefault(); $("q").blur(); search($("q").value); });

// 주소에 ?q=품번 이 있으면 바로 검색 (톡톡 답변·QR 에서 링크로 보낼 때)
const q0 = new URLSearchParams(location.search).get("q");
if (q0) { $("q").value = q0; search(q0); }
</script>
</body>
</html>
